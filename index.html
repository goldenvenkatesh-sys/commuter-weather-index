<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>South India Commuter Weather Index</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-main: #333;
            --card-bg: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        #last-updated {
            font-weight: bold;
            color: #444;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }
        .city-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 6px solid #ccc; /* Will be overwritten by JS */
            transition: transform 0.2s;
        }
        .city-card:hover {
            transform: translateY(-3px);
        }
        .city-name {
            font-size: 1.4rem;
            margin: 0 0 10px 0;
            font-weight: 600;
        }
        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .metrics {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 0.95rem;
            color: #555;
        }
        .advice {
            font-size: 0.95rem;
            line-height: 1.4;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

    <h1>Two-Wheeler Safety Index</h1>
    <div class="subtitle">Live conditions & forecasts | Updated: <span id="last-updated">Loading...</span></div>

    <div class="grid-container" id="dashboard">
        <!-- Cards will be injected here by JavaScript -->
    </div>

    <script>
        // Fetch the JSON file generated by your GitHub Action / Python script
        fetch('commuter_index.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                // Update the timestamp
                document.getElementById('last-updated').innerText = data.update_time;

                const dashboard = document.getElementById('dashboard');
                dashboard.innerHTML = ''; // Clear loading state

                // Loop through each location and build a visual card
                data.locations.forEach(loc => {
                    const card = document.createElement('div');
                    card.className = 'city-card';
                    // Apply the discrete color block logically generated by your Python script
                    card.style.borderTopColor = loc.color_code; 

                    card.innerHTML = `
                        <h2 class="city-name">${loc.city}</h2>
                        <div class="status-badge" style="background-color: ${loc.color_code}">
                            ${loc.status}
                        </div>
                        <div class="metrics">
                            <span>🌧️ ${loc.precip_mm} mm/hr</span>
                            <span>💨 ${loc.wind_kmh} km/h</span>
                        </div>
                        <div class="advice">
                            ${loc.advice}
                        </div>
                    `;
                    dashboard.appendChild(card);
                });
            })
            .catch(error => {
                console.error('Error loading data:', error);
                document.getElementById('dashboard').innerHTML = '<p>Error loading weather data. Please try again later.</p>';
            });
    </script>

</body>
</html>
