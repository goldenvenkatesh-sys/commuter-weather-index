<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>South India Commuter Weather Index</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #1a365d;
            margin-bottom: 5px;
        }
        .update-time {
            text-align: center;
            font-size: 0.9em;
            color: #666;
            margin-bottom: 30px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 8px solid; /* This gets dynamically colored */
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
        }
        .city-name {
            font-size: 1.5em;
            font-weight: bold;
            margin: 0 0 10px 0;
        }
        .metrics {
            display: flex;
            justify-content: space-between;
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.9em;
        }
        .metric-value {
            font-weight: bold;
            color: #2d3748;
        }
        .advice {
            font-size: 1.1em;
            line-height: 1.4;
            color: #4a5568;
        }
        .error-state {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 12px;
            color: #e53e3e;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Two-Wheeler Weather Safety Index</h1>
    <div class="update-time" id="timestamp">Loading latest model data...</div>
    
    <div class="grid" id="dashboard-grid">
        <!-- JavaScript will inject the city cards here -->
    </div>
</div>

<script>
    // Fetch the JSON file generated by your GitHub Actions workflow
    fetch('commuter_index.json')
        .then(response => {
            if (!response.ok) {
                throw new Error('Data not available yet. The automated workflow might still be running.');
            }
            return response.json();
        })
        .then(data => {
            // Update the timestamp
            document.getElementById('timestamp').innerText = "Last Updated: " + data.update_time;
            
            const grid = document.getElementById('dashboard-grid');
            grid.innerHTML = ''; // Clear loading text
            
            // Loop through each location in the JSON and build a card
            data.locations.forEach(loc => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.borderColor = loc.color_code; // Apply Green/Yellow/Red boundary
                
                card.innerHTML = `
                    <h2 class="city-name">${loc.city}</h2>
                    <div class="metrics">
                        <div>Rain: <span class="metric-value">${loc.precip_mm} mm/hr</span></div>
                        <div>Gusts: <span class="metric-value">${loc.wind_kmh} km/h</span></div>
                    </div>
                    <div class="advice" style="color: ${loc.color_code === '#FFCC00' ? '#b79300' : loc.color_code}">
                        <strong>${loc.status}:</strong> ${loc.advice}
                    </div>
                `;
                grid.appendChild(card);
            });
        })
        .catch(error => {
            const grid = document.getElementById('dashboard-grid');
            grid.innerHTML = `
                <div class="error-state">
                    <strong>Notice:</strong> ${error.message}<br>
                    <small>Check your GitHub Actions tab to ensure the Python script executed successfully.</small>
                </div>
            `;
            document.getElementById('timestamp').innerText = "";
        });
</script>

</body>
</html>
