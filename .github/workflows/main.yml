name: Update Commuter Weather Index

on:
  schedule:
    # Runs automatically every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch:
    # Allows you to click a button to run it manually

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required so the bot can push the JSON file back to your repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        # Adding the libraries needed for your ECMWF/xarray processing
        run: pip install pandas numpy xarray requests

      - name: Run Commuter Index Script
        # Make sure this matches the name of your Python file
        run: python generate_index.py

      - name: Commit and push new data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add commuter_index.json
          git commit -m "Automated commuter index update" || echo "No changes to commit"
          git push
